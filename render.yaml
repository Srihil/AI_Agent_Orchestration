databases:
  - name: agent-orchestration-db
    databaseName: orchestration
    plan: free

services:
  - type: web
    name: agent-orchestration-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-orchestration-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: agent-orchestration-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://agent-orchestration-ui.onrender.com
      - key: APP_ENV
        value: production
      - key: MAX_WORKFLOW_STEPS
        value: "15"
      - key: MAX_RETRIES
        value: "2"

  - type: web
    name: agent-orchestration-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agent-orchestration-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
